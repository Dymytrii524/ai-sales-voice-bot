<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Дзвінок Беррі Фарм</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: #0f1f17;
    --bg2: #173326;
    --text: #f2f7f3;
    --muted: #9fb8a9;
    --accent: #5cc98a;
    --end: #e5484d;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: radial-gradient(circle at 50% 25%, var(--bg2), var(--bg) 70%);
    color: var(--text);
    display: flex; flex-direction: column; align-items: center;
    padding: 48px 16px 32px; text-align: center; user-select: none;
  }
  .avatar {
    width: 132px; height: 132px; border-radius: 50%;
    display: grid; place-items: center; font-size: 64px;
    background: #24493a; position: relative; margin-bottom: 20px;
  }
  .avatar::after {
    content: ""; position: absolute; inset: -10px; border-radius: 50%;
    border: 3px solid var(--accent); opacity: 0; transition: opacity .2s;
  }
  body.speaking .avatar::after { opacity: 1; animation: pulse 1.2s ease-in-out infinite; }
  body.listening .avatar { box-shadow: 0 0 0 calc(var(--level, 0) * 26px) rgba(92, 201, 138, .25); }
  @keyframes pulse { 50% { transform: scale(1.08); opacity: .4; } }
  h1 { font-size: 26px; font-weight: 600; }
  .company { color: var(--muted); margin-top: 4px; }
  .status { margin-top: 14px; font-size: 17px; min-height: 24px; color: var(--accent); }
  .timer { color: var(--muted); font-variant-numeric: tabular-nums; margin-top: 4px; min-height: 20px; }
  .subtitles {
    flex: 1; width: 100%; max-width: 420px; margin: 24px 0; overflow-y: auto;
    display: flex; flex-direction: column; justify-content: flex-end; gap: 10px;
  }
  .line { padding: 10px 14px; border-radius: 16px; max-width: 85%; text-align: left; font-size: 15px; line-height: 1.35; }
  .line.ai { background: rgba(255, 255, 255, .08); align-self: flex-start; }
  .line.me { background: rgba(92, 201, 138, .22); align-self: flex-end; }
  .buttons { display: flex; gap: 40px; align-items: center; }
  .btn {
    width: 72px; height: 72px; border-radius: 50%; border: 0; cursor: pointer;
    font-size: 30px; color: #fff; display: grid; place-items: center;
  }
  .btn.start { background: var(--accent); width: 84px; height: 84px; }
  .btn.mute { background: rgba(255, 255, 255, .14); }
  .btn.mute.on { background: #fff; color: var(--bg); }
  .btn.end { background: var(--end); }
  .hint { color: var(--muted); font-size: 13px; margin-top: 12px; min-height: 18px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
  <div class="avatar">🌱</div>
  <h1>Ягідка</h1>
  <div class="company">менеджер Беррі Фарм</div>
  <div class="status" id="status">Натисніть, щоб подзвонити</div>
  <div class="timer" id="timer"></div>

  <div class="subtitles" id="subtitles"></div>

  <div class="buttons">
    <button class="btn start" id="startBtn" aria-label="Подзвонити">📞</button>
    <button class="btn mute" id="muteBtn" aria-label="Вимкнути мікрофон" hidden>🎤</button>
    <button class="btn end" id="endBtn" aria-label="Завершити" hidden>✕</button>
  </div>
  <div class="hint" id="hint"></div>

<script>
const tg = window.Telegram?.WebApp;
tg?.ready();
tg?.expand();

const HEADERS = { "ngrok-skip-browser-warning": "1" };
const SILENCE_MS = 1300;       // pause after speech that ends a phrase
const MIN_SPEECH_MS = 250;     // shorter sounds are ignored (clicks, noise)
const MAX_PHRASE_MS = 30000;

const $ = (id) => document.getElementById(id);
let session = null, stream = null, audioCtx = null, analyser = null, playing = null;
let recorder = null, muted = false, ended = false, startedAt = 0, timerId = null;
let noiseFloor = null;  // background noise level, measured at the start of the call

function setState(state, text) {
  document.body.className = state;
  $("status").textContent = text;
}

function addLine(who, text) {
  const div = document.createElement("div");
  div.className = "line " + who;
  div.textContent = text;
  $("subtitles").appendChild(div);
  $("subtitles").scrollTop = $("subtitles").scrollHeight;
}

function startTimer() {
  startedAt = Date.now();
  timerId = setInterval(() => {
    const s = Math.floor((Date.now() - startedAt) / 1000);
    $("timer").textContent = `${String(Math.floor(s / 60)).padStart(2, "0")}:${String(s % 60).padStart(2, "0")}`;
  }, 500);
}

async function play(base64) {
  if (ended) return;
  const bytes = Uint8Array.from(atob(base64), (c) => c.charCodeAt(0));
  let buffer;
  try {
    buffer = await audioCtx.decodeAudioData(bytes.buffer);
  } catch (e) {
    return;
  }
  await new Promise((resolve) => {
    playing = audioCtx.createBufferSource();
    playing.buffer = buffer;
    playing.connect(audioCtx.destination);
    playing.onended = resolve;
    playing.start();
  });
  playing = null;
}

async function speak(text, audio) {
  setState("speaking", "Ягідка говорить…");
  addLine("ai", text);
  await play(audio);
}

// ---- microphone: record one phrase, stop automatically after a pause ----
function recordPhrase() {
  return new Promise((resolve) => {
    const chunks = [];
    recorder = new MediaRecorder(stream);
    recorder.ondataavailable = (e) => e.data.size && chunks.push(e.data);
    recorder.onstop = () => resolve(heardSpeech ? new Blob(chunks, { type: recorder.mimeType }) : null);
    recorder.start();

    const data = new Uint8Array(analyser.fftSize);
    let heardSpeech = false, speechStart = 0, lastLoud = 0;
    const began = Date.now();

    const tick = () => {
      if (recorder.state !== "recording") return;
      analyser.getByteTimeDomainData(data);
      let sum = 0;
      for (const v of data) sum += ((v - 128) / 128) ** 2;
      const rms = Math.sqrt(sum / data.length);
      const threshold = Math.max(0.02, (noiseFloor ?? 0.01) * 2.5);
      const now = Date.now();
      document.body.style.setProperty("--level", Math.min(1, rms * 8).toFixed(2));

      if (!muted && rms > threshold) {
        if (!speechStart) speechStart = now;
        lastLoud = now;
        if (now - speechStart > MIN_SPEECH_MS) heardSpeech = true;
      } else if (speechStart && !heardSpeech && now - lastLoud > 300) {
        speechStart = 0;  // it was just a short noise
      }

      const pauseAfterSpeech = heardSpeech && now - lastLoud > SILENCE_MS;
      const tooLong = heardSpeech && now - began > MAX_PHRASE_MS;
      if (pauseAfterSpeech || tooLong || ended) recorder.stop();
      else setTimeout(tick, 50);
    };
    tick();
  });
}

async function conversation() {
  while (!ended) {
    setState("listening", muted ? "Мікрофон вимкнено" : "Слухаю…");
    const phrase = await recordPhrase();
    if (ended) break;
    if (!phrase) continue;

    setState("thinking", "Думаю…");
    const form = new FormData();
    form.append("session", session);
    form.append("audio", phrase, phrase.type.includes("mp4") ? "phrase.mp4" : "phrase.webm");
    let answer;
    try {
      const res = await fetch("webcall/turn", { method: "POST", body: form, headers: HEADERS });
      if (!res.ok) throw new Error(res.status);
      answer = await res.json();
    } catch (e) {
      setState("", "Зв'язок перервався");
      return finish(false);
    }
    if (answer.heard) addLine("me", answer.heard);
    await speak(answer.text, answer.audio);
    if (answer.finished) return finish(true);
  }
}

// ---- buttons ----
$("startBtn").onclick = async () => {
  // audio must be unlocked inside the tap (iPhone), so the AudioContext is created right here
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  audioCtx.resume();

  $("startBtn").hidden = true;
  setState("thinking", "З'єднання…");
  try {
    stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true } });
  } catch (e) {
    $("startBtn").hidden = false;
    setState("", "Немає доступу до мікрофона");
    $("hint").textContent = "Дозвольте Telegram використовувати мікрофон у налаштуваннях телефону.";
    return;
  }
  analyser = audioCtx.createAnalyser();
  analyser.fftSize = 1024;
  audioCtx.createMediaStreamSource(stream).connect(analyser);
  measureNoise();

  try {
    const res = await fetch("webcall/start", {
      method: "POST",
      headers: { ...HEADERS, "Content-Type": "application/json" },
      body: JSON.stringify({ initData: tg?.initData || "" }),
    });
    if (res.status === 429) {  // daily limit reached
      stream.getTracks().forEach((t) => t.stop());
      setState("", "Ліміт на сьогодні вичерпано");
      $("hint").textContent = (await res.json()).detail;
      return;
    }
    if (!res.ok) throw new Error(res.status);
    const data = await res.json();
    session = data.session;
    $("muteBtn").hidden = false;
    $("endBtn").hidden = false;
    $("hint").textContent = "Говоріть після того, як Ягідка замовкне";
    startTimer();
    await speak(data.text, data.audio);
    conversation();
  } catch (e) {
    stream.getTracks().forEach((t) => t.stop());
    $("startBtn").hidden = false;
    setState("", "Не вдалося з'єднатися");
    $("hint").textContent = "Відкрийте дзвінок кнопкою в боті Беррі Фарм.";
  }
};

// while connecting (before the greeting), listen to the room to learn its background noise
function measureNoise() {
  const data = new Uint8Array(analyser.fftSize);
  let samples = 0, max = 0;
  const id = setInterval(() => {
    analyser.getByteTimeDomainData(data);
    let sum = 0;
    for (const v of data) sum += ((v - 128) / 128) ** 2;
    max = Math.max(max, Math.sqrt(sum / data.length));
    if (++samples >= 10) {
      clearInterval(id);
      noiseFloor = Math.min(max, 0.04);
    }
  }, 50);
}

$("muteBtn").onclick = () => {
  muted = !muted;
  $("muteBtn").classList.toggle("on", muted);
  if (document.body.className === "listening") $("status").textContent = muted ? "Мікрофон вимкнено" : "Слухаю…";
};

$("endBtn").onclick = () => finish(false);

function finish(saved) {
  if (ended) return;
  ended = true;
  try { playing?.stop(); } catch (e) {}
  clearInterval(timerId);
  if (recorder?.state === "recording") recorder.stop();
  stream?.getTracks().forEach((t) => t.stop());
  if (session && !saved) {
    fetch("webcall/end", {
      method: "POST", keepalive: true,
      headers: { ...HEADERS, "Content-Type": "application/json" },
      body: JSON.stringify({ session }),
    });
  }
  setState("", "Дзвінок завершено");
  $("muteBtn").hidden = $("endBtn").hidden = true;
  $("hint").textContent = "Дякуємо! Деталі розмови збережено.";
  setTimeout(() => tg?.close(), 2500);
}

// closing Telegram's window also ends the call
window.addEventListener("pagehide", () => {
  if (session && !ended) navigator.sendBeacon("webcall/end", session);
});
</script>
</body>
</html>
